<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registry | The Cotton Blossoms Boutique</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="flower">✿</span><span>THE COTTON BLOSSOMS<small>BOUTIQUE GIFT REGISTRY</small></span></a><a class="header-link" href="/">Home</a></header><main class="locations-band"><p class="eyebrow center">A SPECIAL CELEBRATION</p><div id="registry"><p class="empty">Loading registry…</p></div><p><a class="btn secondary" href="/">Back to registry home</a></p></main><footer><span>✿ The Cotton Blossoms Boutique</span><span>Made for life's sweetest celebrations.</span></footer><script>
(async()=>{const root=document.querySelector("#registry");const id=new URLSearchParams(location.search).get("id");if(!id){root.textContent="No registry was selected.";return;}try{const r=await fetch("/api/registries/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error);const x=d.registry;const h=document.createElement("h1");h.textContent=x.title;const p=document.createElement("p");p.textContent="Created by "+x.name+" · "+x.occasion;const l=document.createElement("p");l.textContent="Preferred pickup: "+x.location+(x.event_date?" · Event date: "+x.event_date:"");const note=document.createElement("p");note.className="preview-note";note.textContent="Gift items and purchasing will appear here after the product catalog and Square checkout are connected. Both online checkout and in-store reservations are planned.";root.replaceChildren(h,p,l,note);}catch(e){root.textContent="This registry could not be found yet.";}})();
</script></body></html>
